<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>音訊正倒放錄音器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .app-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #f1f5f9; }
    .status-badge {
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #334155;
      color: #94a3b8;
    }
    .status-badge.recording { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
    .status-badge.ready { background: #10b981; color: white; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .record-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #ef4444;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s;
    }
    .record-btn:active { transform: scale(0.95); }
    .record-btn.recording { border-radius: 18px; width: 68px; height: 68px; background: #dc2626; }

    .btn-group { display: flex; gap: 12px; width: 100%; }
    .play-btn {
      flex: 1;
      padding: 16px 12px;
      border-radius: 16px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .play-btn.reverse { background: #8b5cf6; }
    .play-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-card">
  <h1>語音正倒放播放器</h1>
  <div id="status" class="status-badge">點擊圓鈕開始錄音</div>

  <button id="btnRecord" class="record-btn">錄音</button>

  <div class="btn-group">
    <button id="btnForward" class="play-btn" disabled>正向播放 ▶</button>
    <button id="btnBackward" class="play-btn reverse" disabled>倒著播放 ◀</button>
  </div>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let audioContext;
  let audioBuffer = null;
  let currentSource = null;

  const btnRecord = document.getElementById('btnRecord');
  const btnForward = document.getElementById('btnForward');
  const btnBackward = document.getElementById('btnBackward');
  const status = document.getElementById('status');

  btnRecord.onclick = async () => {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      btnRecord.classList.remove('recording');
      btnRecord.textContent = '重錄';
      status.textContent = '處理中...';
      status.className = 'status-badge';
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await audioBlob.arrayBuffer();
        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        btnForward.disabled = false;
        btnBackward.disabled = false;
        status.textContent = `錄音完成 (${audioBuffer.duration.toFixed(1)}s)`;
        status.className = 'status-badge ready';
      };

      mediaRecorder.start();
      btnRecord.classList.add('recording');
      btnRecord.textContent = '停止';
      status.textContent = '正在錄音...';
      status.className = 'status-badge recording';
    } catch (err) {
      status.textContent = '麥克風授權失敗';
    }
  };

  function playAudio(isReversed) {
    if (!audioBuffer) return;
    if (currentSource) currentSource.stop();

    const channels = audioBuffer.numberOfChannels;
    const playBuffer = audioContext.createBuffer(channels, audioBuffer.length, audioBuffer.sampleRate);

    for (let c = 0; c < channels; c++) {
      const src = audioBuffer.getChannelData(c);
      const dst = playBuffer.getChannelData(c);
      if (isReversed) {
        for (let i = 0; i < audioBuffer.length; i++) {
          dst[i] = src[audioBuffer.length - 1 - i];
        }
      } else {
        dst.set(src);
      }
    }

    currentSource = audioContext.createBufferSource();
    currentSource.buffer = playBuffer;
    currentSource.connect(audioContext.destination);
    currentSource.start();
  }

  btnForward.onclick = () => playAudio(false);
  btnBackward.onclick = () => playAudio(true);
</script>

</body>
</html>
